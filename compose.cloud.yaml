name: dev-orchestrator
services:
  database:
    image: postgres:17
    environment:
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a database password}
      POSTGRES_DB: dev_orchestrator
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator -d dev_orchestrator"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build: ./platform
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:4100:4100"
    environment:
      DATABASE_URL: ${DATABASE_URL:?set the PostgreSQL URL using host database}
      PUBLIC_URL: ${PUBLIC_URL:?set the public HTTPS origin}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?generate at least 64 bytes}
      CONNECTION_ENCRYPTION_KEY: ${CONNECTION_ENCRYPTION_KEY:?base64-encoded 32-byte key}
      RESEND_API_KEY: ${RESEND_API_KEY:?set Resend API key}
      MAIL_FROM: ${MAIL_FROM:?set sender email}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-transcribe}
      OPENAI_TASK_MODEL: ${OPENAI_TASK_MODEL:-gpt-6-luna}
      LINEAR_CLIENT_ID: ${LINEAR_CLIENT_ID:-}
      LINEAR_CLIENT_SECRET: ${LINEAR_CLIENT_SECRET:-}
      LINEAR_WEBHOOK_SECRET: ${LINEAR_WEBHOOK_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_PRIVATE_KEY_PATH: ${GITHUB_PRIVATE_KEY_PATH:-}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
volumes:
  database:
